# ---------------------------
# Datasource (MySQL)
# ---------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campuslearning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dungcon2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------
# Gemini API
# ---------------------------
gemini.api.key=${GEMINI_API_KEY:default-gemini-key}

# ---------------------------
# Euruka
# ---------------------------
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ---------------------------
# OAuth2 Google
# ---------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.provider.google.user-name-attribute=sub
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.web=DEBUG
# ---------------------------
# Management / Metrics
# ---------------------------
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.server.port=8080

# ---------------------------
# Server
# ---------------------------
server.port=8080
server.forward-headers-strategy=framework
spring.application.name=campuslearning

# ---------------------------
# PayPal
# ---------------------------
paypal.client.id=${PAYPAL_CLIENT_ID:default-paypal-id}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:default-paypal-secret}
paypal.mode=${PAYPAL_MODE:sandbox}

# ---------------------------
# JPA / Hibernate
# ---------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------
# JWT
# ---------------------------
jwt.secret=${JWT_SECRET:my-super-secret-key-123456-my-super-secret-key-123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------------------------
# DevTools
# ---------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ---------------------------
# Views
# ---------------------------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ---------------------------
# RabbitMQ
# ---------------------------
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=5
spring.rabbitmq.template.retry.initial-interval=5000
spring.rabbitmq.connection-timeout=10000

# ---------------------------
# Redis (Post, Comment, Conversation, Message, Story)
# ---------------------------
spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

redis.comment.host=${SPRING_REDIS_COMMENT_HOST:redis-comment}
redis.comment.port=${SPRING_REDIS_COMMENT_PORT:6379}
redis.comment.password=${SPRING_REDIS_COMMENT_PASSWORD:}

redis.conversation.host=${SPRING_REDIS_CONVERSATION_HOST:redis-conversation}
redis.conversation.port=${SPRING_REDIS_CONVERSATION_PORT:6379}
redis.conversation.password=${SPRING_REDIS_CONVERSATION_PASSWORD:}

redis.message.host=${SPRING_REDIS_MESSAGE_HOST:redis-message}
redis.message.port=${SPRING_REDIS_MESSAGE_PORT:6379}
redis.message.password=${SPRING_REDIS_MESSAGE_PASSWORD:}

redis.story.host=${SPRING_REDIS_STORY_HOST:redis-story}
redis.story.port=${SPRING_REDIS_STORY_PORT:6379}
redis.story.password=${SPRING_REDIS_STORY_PASSWORD:}

spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
server.max-http-header-size=100KB
spring.servlet.multipart.enabled=true
